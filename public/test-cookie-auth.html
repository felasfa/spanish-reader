<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Auth Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7; color: #1d1d1f; padding: 32px 20px;
      font-size: 14px; line-height: 1.5;
    }
    .card {
      max-width: 680px; margin: 0 auto;
      background: #fff; border-radius: 14px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      padding: 28px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #6b7280; margin-bottom: 24px; font-size: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
    label span { font-weight: 400; color: #6b7280; font-size: 12px; margin-left: 6px; }
    textarea, input[type=url] {
      width: 100%; padding: 9px 12px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      background: #fafafa; color: #1d1d1f;
      outline: none; resize: vertical;
      transition: border-color 0.15s;
    }
    textarea:focus, input[type=url]:focus { border-color: #c62828; }
    input[type=url] { font-family: inherit; font-size: 13px; }
    button {
      margin-top: 20px; width: 100%;
      padding: 11px; border-radius: 8px;
      background: #c62828; color: #fff;
      font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #b71c1c; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }

    #result { margin-top: 20px; display: none; }
    .result-box {
      padding: 16px; border-radius: 10px;
      border: 1px solid;
    }
    .result-box.pass { background: #f0fdf4; border-color: #86efac; }
    .result-box.fail { background: #fef2f2; border-color: #fca5a5; }
    .result-box.error { background: #fff7ed; border-color: #fdba74; }
    .result-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .result-meta { font-size: 12px; color: #6b7280; margin-bottom: 10px; }
    .preview-label { font-weight: 600; font-size: 12px; margin-bottom: 4px; margin-top: 10px; }
    .preview-text {
      font-size: 12px; color: #374151;
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 6px; padding: 10px;
      white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow-y: auto;
    }
    .matches { font-size: 12px; color: #b91c1c; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cookie Auth Tester</h1>
    <p class="subtitle">Tests whether elpais.com subscriber cookies grant server-side access to paywalled articles.</p>

    <label for="pmuser">pmuser cookie <span>from DevTools → Storage → Cookies</span></label>
    <textarea id="pmuser" rows="4" placeholder='{"skus":["ISPPAREN..."],...}'></textarea>

    <label for="arcId">ArcId.USER_INFO cookie <span>from DevTools → Storage → Cookies</span></label>
    <textarea id="arcId" rows="4" placeholder="eyJ1dWlk..."></textarea>

    <label for="url">Article URL <span>use a paywalled article you can view when logged in</span></label>
    <input type="url" id="url" placeholder="https://elpais.com/...">

    <button id="test-btn" onclick="runTest()">Test Server-Side Access</button>

    <div id="result">
      <div id="result-box" class="result-box">
        <div id="result-title" class="result-title"></div>
        <div id="result-meta" class="result-meta"></div>
        <div class="preview-label">Article preview extracted by server:</div>
        <div id="preview-text" class="preview-text"></div>
        <div id="matches" class="matches"></div>
      </div>
    </div>
  </div>

  <script>
    async function runTest() {
      const pmuser = document.getElementById('pmuser').value.trim();
      const arcId  = document.getElementById('arcId').value.trim();
      const url    = document.getElementById('url').value.trim();
      const btn    = document.getElementById('test-btn');
      const result = document.getElementById('result');

      if (!url) { alert('Please enter an article URL'); return; }

      btn.disabled = true;
      btn.textContent = 'Testing…';
      result.style.display = 'none';

      try {
        const res  = await fetch('/api/test-cookie-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pmuser, arcId, url }),
        });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        const box   = document.getElementById('result-box');
        const title = document.getElementById('result-title');
        const meta  = document.getElementById('result-meta');
        const prev  = document.getElementById('preview-text');
        const match = document.getElementById('matches');

        box.className = 'result-box ' + (data.paywallFound ? 'fail' : 'pass');
        title.textContent = data.paywallFound
          ? '✗ Paywall still present — cookies not sufficient'
          : '✓ No paywall detected — cookies appear to work!';
        meta.textContent = `HTTP ${data.httpStatus} · ${(data.htmlLength / 1024).toFixed(0)} KB received`;
        prev.textContent = data.preview;
        match.textContent = data.paywallMatches.length
          ? 'Paywall patterns found: ' + data.paywallMatches.join(', ')
          : '';

        result.style.display = 'block';
      } catch (err) {
        const box = document.getElementById('result-box');
        box.className = 'result-box error';
        document.getElementById('result-title').textContent = '⚠ Error: ' + err.message;
        document.getElementById('result-meta').textContent = '';
        document.getElementById('preview-text').textContent = '';
        document.getElementById('matches').textContent = '';
        result.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Test Server-Side Access';
      }
    }
  </script>
</body>
</html>
